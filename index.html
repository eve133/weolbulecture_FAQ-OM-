<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강의장 운영 FAQ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --navy:#1B2B4F; --navy-2:#2A3F6B; --navy-soft:#EEF2F8;
  --bg:#FFFFFF; --bg-2:#F7F9FC; --card:#FFFFFF;
  --line:#E3E8EF; --text:#1B2B4F; --body:#3A4558; --muted:#7A8599;
  --red:#D14343; --red-soft:#FDECEC;
  --mark:#FFF1A8; --on-navy:#FFFFFF; --on-navy-muted:#B9C4DA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#8FA8DA; --navy-2:#24365C; --navy-soft:#1E2A42;
    --bg:#111827; --bg-2:#141C2E; --card:#182235;
    --line:#29354D; --text:#E7ECF5; --body:#C9D2E1; --muted:#8A96AB;
    --red:#F07B7B; --red-soft:#3A1F24; --mark:#5C4E00;
    --on-navy:#FFFFFF; --on-navy-muted:#A9B6CE;
  }
  :root:not([data-theme="light"]) .desk{background:#15213D}
}
:root[data-theme="dark"]{
  --navy:#8FA8DA; --navy-2:#24365C; --navy-soft:#1E2A42;
  --bg:#111827; --bg-2:#141C2E; --card:#182235;
  --line:#29354D; --text:#E7ECF5; --body:#C9D2E1; --muted:#8A96AB;
  --red:#F07B7B; --red-soft:#3A1F24; --mark:#5C4E00;
}
:root[data-theme="dark"] .desk{background:#15213D}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg-2);color:var(--body);
  font-family:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}

/* 헤더 */
.desk{background:#1B2B4F;color:var(--on-navy);padding:40px 20px 32px}
.desk-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.desk h1{margin:0;font-size:clamp(24px,5vw,30px);font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#fff}
.desk p.sub{margin:6px 0 0;color:var(--on-navy-muted);font-size:15px}
.add-btn{display:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.add-btn.show{display:inline-block}
.add-btn:hover{background:rgba(255,255,255,.1)}
.top-btns{display:flex;gap:8px;flex-wrap:wrap}
.req-btn{border:0;background:#fff;color:#1B2B4F;font-weight:700;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.req-btn:hover{background:#E6ECF7}
.item{scroll-margin-top:150px}

/* 하단 요청 남기기 */
.req{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;scroll-margin-top:150px}
.req h2{margin:0;font-size:17px;color:var(--text)}
.req p.desc{margin:4px 0 14px;font-size:13.5px;color:var(--muted)}
.req-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.req input,.req textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.req input:focus,.req textarea:focus{border-color:var(--navy);outline:0}
.req .nick{flex:0 0 180px}
.req .msg{flex:1;min-width:220px}
.req textarea{min-height:46px;height:46px;resize:vertical;line-height:1.5;transition:height .15s}
.req textarea:focus,.req textarea.filled{height:110px}
.req-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.req-note{font-size:13px;color:var(--muted)}
.req-note.ok{color:var(--navy);font-weight:600}
.req-note.err{color:var(--red);font-weight:600}
@media (max-width:520px){.req .nick{flex:1 1 100%}}
.hint{margin:10px 2px 0;font-size:13px;color:var(--on-navy-muted)}
kbd{font-family:inherit;border:1px solid var(--on-navy-muted);border-radius:4px;padding:0 5px;font-size:12px}

/* 검색창 */
.search{
  margin-top:24px;display:flex;align-items:center;gap:10px;
  background:#fff;color:#1B2B4F;border:1px solid transparent;border-radius:12px;padding:4px 6px 4px 16px;
  box-shadow:0 6px 20px rgba(10,20,45,.18);
}
.search:focus-within{border-color:#4A6FB5}
.search svg{flex:none;color:#7A8599}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#1B2B4F;font-size:17px;padding:12px 0}
.search input::placeholder{color:#9AA4B5}
.clear{border:0;background:transparent;color:#7A8599;cursor:pointer;padding:8px 10px;border-radius:8px;display:none;font-size:14px}
.clear.show{display:block}

/* 필터 */
.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.filters .wrap{padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
